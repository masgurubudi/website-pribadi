<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hasil Try Out TKA Matematika — Kabupaten Pacitan</title>
<style>
:root{
  --bg:#f4f5fb; --surface:#ffffff; --text:#1c1c22; --muted:#6b7280; --border:#e5e7eb;
  --accent:#4f46e5; --accent-dark:#4338ca; --accent-soft:#eef2ff; --gold:#c9a227;
  --zebra:#fafaff; --shadow:rgba(20,20,60,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  box-shadow:0 2px 10px var(--shadow)}
header.card{display:flex;align-items:center;gap:16px;padding:20px 22px}
header img.logo{width:76px;height:76px;flex:0 0 auto;object-fit:contain}
header h1{font-size:22px;line-height:1.25;margin:0 0 6px}
header p.sub{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.stat{padding:16px 10px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--accent);line-height:1.1}
.stat span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{flex:1;border:1.5px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:999px;padding:11px 6px;font-size:14.5px;font-weight:700;cursor:pointer}
.tabs button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.controls{padding:16px}
.controls .row{display:flex;gap:10px;flex-wrap:wrap}
.controls input[type="search"],.controls select{flex:1 1 200px;min-width:0;
  border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;font-size:15px;
  background:#fff;color:var(--text);outline:none}
.controls input[type="search"]:focus,.controls select:focus{border-color:var(--accent)}
.controls label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.controls .hint{margin:10px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.countline{margin:14px 2px 8px;color:var(--muted);font-size:13.5px}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:16px;background:#fff;
  box-shadow:0 2px 10px var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:640px;font-size:14.5px}
thead th{background:var(--accent-soft);color:var(--accent-dark);text-align:left;
  padding:11px 12px;font-size:13px;letter-spacing:.02em;white-space:nowrap;
  position:sticky;top:0}
thead th.num,td.num{text-align:right;white-space:nowrap}
tbody td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:top;line-height:1.45}
tbody tr:nth-child(even){background:var(--zebra)}
td.rank{font-weight:800;white-space:nowrap}
td.name{font-weight:700}
td.score{font-weight:800;color:var(--accent);text-align:right;white-space:nowrap}
td.kabrank{text-align:right;white-space:nowrap;color:var(--muted);font-weight:700}
.more{display:block;width:100%;margin:14px 0 0;padding:13px;border-radius:12px;cursor:pointer;
  border:1.5px solid var(--accent);background:#fff;color:var(--accent);
  font-size:15px;font-weight:700}
.more:hover{background:var(--accent-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6}
footer{margin-top:22px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7}
footer b{color:var(--text)}
@media (max-width:560px){
  header.card{padding:16px;gap:12px}
  header img.logo{width:60px;height:60px}
  header h1{font-size:18.5px}
  .stat b{font-size:22px}
  .tabs button{font-size:13px;padding:10px 4px}
}
</style>
</head>

function medal(r){return r===1?'🥇 ':r===2?'🥈 ':r===3?'🥉 ':'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function buildKecSel(){
  var el=document.getElementById('kecSel');
  el.innerHTML=KEC.map(function(k){
    return '<option value="'+esc(k[0])+'"'+(k[0]===state.kec?' selected':'')+'>'+esc(k[0])+' ('+fmtInt(k[1])+')</option>';
  }).join('');
}
function buildSekSel(){
  var el=document.getElementById('sekSel');
  var q=state.sekQ.trim().toLowerCase();
  var opts=SEK.filter(function(s){return !q||s[0].toLowerCase().indexOf(q)>=0;});
  // sekolah yang sedang dipilih selalu dipertahankan di daftar, walau tak cocok dgn kata cari

    var cur=SEK.filter(function(s){return s[0]===state.sek;});
    if(cur.length) opts=cur.concat(opts);
  }
  var html='<option value="">— Pilih sekolah —</option>'+opts.map(function(s){

function render(){

  if(state.view==='kec') base=base.filter(function(d){return d.k===state.kec;});

    if(!state.sek) base=[];

  }

  // supaya pencarian tidak mengubah peringkat siswa
  var rankMap=new Map(),rank=0,prev=null;
  base.forEach(function(d){ if(d.v!==prev){rank++;prev=d.v;} rankMap.set(d,rank); });
  var list=base;
  if(state.q){
    var q=state.q.trim().toLowerCase();
    if(q) list=list.filter(function(d){return d.n.toLowerCase().indexOf(q)>=0;});
  }

  var head=document.getElementById('headRow');

}
